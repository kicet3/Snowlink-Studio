<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f4">
  <title>Snowframe Studio · 콘텐츠 작업실</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/modules/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">작업실로 건너뛰기</a>
  <div class="mobile-bar"><a class="brand" href="#board"><img src="/logo.svg" alt=""><span>Snowframe Studio</span></a><button class="icon-button" id="menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar"><span data-icon="menu"></span></button></div>
  <aside class="sidebar" id="sidebar" aria-label="작업실 메뉴">
    <a class="brand" href="#board" aria-label="Snowframe Studio 제작 보드"><img src="/logo.svg" alt=""><span>Snowframe Studio</span></a>
    <p class="sidebar-caption">A PLACE FOR YOUR STORIES</p>
    <nav class="side-nav" aria-label="작업 공간"><p class="nav-label">WORKSPACE</p>
      <a href="#board" id="tab-board" data-tab="board" aria-current="page"><span data-icon="board"></span><span>제작 보드</span><span class="tab-count" id="production-count">0</span></a>
      <a href="#characters" id="tab-characters" data-tab="characters"><span data-icon="people"></span><span>캐릭터 시트</span></a>
      <a href="#scenarios" id="tab-scenarios" data-tab="scenarios"><span data-icon="film"></span><span>시나리오 · 영상 스타일</span></a>
      <a href="#trends" id="tab-trends" data-tab="trends"><span data-icon="radar"></span><span>트렌드 탐색</span><span class="connection-dot" data-status="trends"></span></a>
      <a href="#ima2" id="tab-ima2" data-tab="ima2"><span data-icon="spark"></span><span>이미지 · 영상 제작</span><span class="connection-dot" data-status="ima2"></span></a>
      <a href="#shortgpt" id="tab-shortgpt" data-tab="shortgpt"><span data-icon="film"></span><span>ShortGPT · 컷 편집</span></a>
      <div class="nav-divider"></div>
      <a href="#settings" id="tab-settings" data-tab="settings"><span data-icon="settings"></span><span>설정 · OAuth</span></a>
    </nav>
    <div class="sidebar-note seasonal-surface"><span data-icon="spark"></span><p>작은 영감이<br>하나의 이야기로.</p><span class="eyebrow">SNOW & AUTUMN</span></div>
    <div class="sidebar-footer"><span class="local-badge"><i></i> 나의 작업실</span><button class="icon-button" id="guide-button" aria-label="작업실 사용 안내">?</button></div>
  </aside>
  <button class="nav-backdrop" id="nav-backdrop" aria-label="메뉴 닫기" hidden></button>
  <main id="workspace" tabindex="-1">
    <section id="panel-board" role="region" aria-labelledby="tab-board" class="workspace-panel"><div class="page-loading">작업실을 불러오고 있어요…</div></section>
    <section id="panel-characters" role="region" aria-labelledby="tab-characters" class="workspace-panel" hidden></section>
    <section id="panel-scenarios" role="region" aria-labelledby="tab-scenarios" class="workspace-panel" hidden></section>
    <section id="panel-trends" role="region" aria-labelledby="tab-trends" class="workspace-panel" hidden></section>
    <section id="panel-ima2" role="region" aria-labelledby="tab-ima2" class="workspace-panel" hidden></section>
    <section id="panel-shortgpt" role="region" aria-labelledby="tab-shortgpt" class="workspace-panel" hidden></section>
    <section id="panel-settings" role="region" aria-labelledby="tab-settings" class="workspace-panel" hidden></section>
    <section id="panel-oauth" role="region" aria-label="MCP 연결 승인" class="workspace-panel" hidden></section>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="editor" aria-labelledby="dialog-title"></dialog>
</body>
</html>
