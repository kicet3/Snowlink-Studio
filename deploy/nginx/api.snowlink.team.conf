# Include inside nginx's http block. The API listens on the Mac host at 3400.
# Issue the certificate with Certbot's webroot before enabling the HTTPS block.
upstream snowlink_backend {
    zone snowlink_backend 64k;
    server host.docker.internal:3400 resolve;
}

server {
    listen 80;
    server_name api.snowlink.team;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://api.snowlink.team$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.snowlink.team;

    ssl_certificate /etc/letsencrypt/live/api.snowlink.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.snowlink.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20m;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 @api_unavailable;

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noimageindex" always;
        return 503 '{"error":"API server is temporarily unavailable. Please retry shortly.","code":"API_UNAVAILABLE"}';
    }

    location / {
        proxy_pass http://snowlink_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_cache off;
    }
}
